[package]
name = "gitlab-tool"
version = "0.1.11"
edition = "2024"
publish = false
description = "Self-hosted GitLab REST API tool for LunarWing"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
url = "2"
wit-bindgen = "0.41"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
