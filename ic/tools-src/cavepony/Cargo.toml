[package]
name = "cavepony-tool"
version = "0.4.6"
edition = "2021"
description = "Cavepony text compression and expansion tool for LunarWing"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode-perl"] }
wit-bindgen = "0.41.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
