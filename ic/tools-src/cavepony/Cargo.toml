[package]
name = "cavepony-tool"
version = "0.3.0"
edition = "2021"
description = "Cavepony text compression and expansion tool for LunarWing"
license = "MIT"
publish = false

[dependencies]
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.41.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
