[workspace]
members = [".", "crates/lunarwing_common", "crates/lunarwing_safety", "crates/lunarwing_skills", "crates/lunarwing_engine", "crates/lunarwing_health_metrics"]
exclude = [
    "job_prompt",
    "channels-src/xmpp",
    "bridges/xmpp-bridge",
    "fuzz",
    "crates/lunarwing_safety/fuzz",
]

[package]
name = "lunarwing"
version = "2.0.9"
edition = "2024"
rust-version = "1.96.1"
description = "Secure, privacy-first AI agent with XMPP/OMEMO, Gotify, and open-protocol channels"
authors = ["LunarWing Team"]
license = "AGPL-3.0-or-later"
homepage = "https://git.lunarwing.org/lunarwing/lunarwing2"
repository = "https://git.lunarwing.org/lunarwing/lunarwing2"
readme = "README.md"
keywords = ["ai-agent", "xmpp", "omemo", "privacy", "self-hosted"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[package.metadata.wix]
upgrade-guid = "D0156E61-BA37-451E-8AB9-1A2ECCCFA48F"
path-guid = "F90B6EA6-87F7-499B-BB19-CF55DE1EB339"
license = false
eula = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "form", "charset", "http2", "rustls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database - PostgreSQL (default, feature-gated)
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
postgres-types = { version = "0.2", features = ["with-serde_json-1"], optional = true }
refinery = { version = "0.9", features = ["tokio-postgres"], optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = { version = "0.8", optional = true }

# Database - libSQL/Turso (optional embedded database)
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"
toml = "1"

# Core types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rust_decimal = { version = "1", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Terminal
crossterm = "0.29"
rustyline = { version = "18", features = ["custom-bindings", "derive", "with-file-history"] }
termimad = "0.35"

# Channel integrations
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "set-header", "catch-panic", "compression-gzip"] }

# ACP (Agent Client Protocol) bridge
agent-client-protocol = "0.10"
tokio-util = { version = "0.7", features = ["compat"] }

# Cron scheduling for routines
cron = "0.17"

# Internal crates
lunarwing_common = { path = "crates/lunarwing_common", version = "2.0.9" }
lunarwing_engine = { path = "crates/lunarwing_engine", version = "2.0.9" }
lunarwing_skills = { path = "crates/lunarwing_skills", version = "2.0.9" }

# Safety/sanitization
lunarwing_safety = { path = "crates/lunarwing_safety", version = "2.0.9" }
regex = "1"
unicode-normalization = "0.1"

# Fuzzy string matching for the reflex router
strsim = "0.11"

# YAML parsing for SKILL.md frontmatter
serde_norway = "0.9"

# Filesystem paths
dirs = "6"
fs4 = "0.6"

# Semantic versioning
semver = "1"

# Secrecy for sensitive values
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"

# URL parsing and encoding
url = "2"
urlencoding = "2"

# Open URLs in browser
open = "5"

# Vector embeddings for semantic search
# The postgres feature provides ToSql/FromSql for postgres-types (shared by tokio-postgres)
pgvector = { version = "0.4", features = ["postgres"], optional = true }

# WASM sandbox for untrusted tool execution
# >=36.0.13 required for RUSTSEC-2026-0222 (store type-index confusion)
wasmtime = { version = "36.0.13", features = ["component-model"] }
wasmtime-wasi = "36.0.13"  # WASI support for component model
wasmparser = "0.220"  # WASM binary parsing for validation

# Cryptography for secrets management
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"

# SSH client (pure Rust, async)
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }

# Cryptography utilities
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
subtle = "2"  # Constant-time comparisons for token validation

# Multi-provider LLM support
# Rig's aggregate `reqwest` feature also enables OS proxy discovery. Enable its
# shared HTTP features above while preserving LunarWing's environment-only proxy behavior.
rig-core = { version = "0.40", default-features = false, features = ["rustls"] }

# Docker sandbox
bollard = "0.18"

# Archive extraction for WASM extension bundles
flate2 = "1"
tar = "0.4"

# Document text extraction
pdf-extract = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP proxy for sandboxed network access
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1", "http2"] }
http-body-util = "0.1"
http = "1"

# External worker WebSocket client
tokio-tungstenite = "0.26"
bytes = "1"
base64 = "0.23"
mime_guess = "2.0.5"
clap_complete = "4.5.0"
lru = "0.18"
tempfile = "3"

# XMPP channel
tokio-xmpp = { version = "6", features = ["starttls"] }
xmpp-parsers = "0.23"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# HTML to Markdown conversion (feature gated)
html-to-markdown-rs = { version = "2.3", optional = true }
readabilityrs = { version = "0.1.2", optional = true }
ed25519-dalek = { version = "2.2.0", features = ["std"] }
hex = "0.4.3"
libsignal-protocol = { path = "vendor/libsignal-protocol" }

# OpenClaw import (feature gated)
json5 = { version = "1", optional = true }

# Unix process signalling for graceful tunnel shutdown
[target.'cfg(unix)'.dependencies]
bs58 = "0.5.1"
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"
# Raw syscalls for MCP host sandboxing (prctl, unshare, Landlock)
libc = "0.2"
nix = { version = "0.31", features = ["fs", "signal", "process", "resource", "user"] }

# macOS keychain
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Linux secret-service (GNOME Keyring, KWallet)
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
zbus = "4"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tokio-test = "0.4"
tracing-test = "0.2"
tokio-tungstenite = "0.26"
pretty_assertions = "1"
insta = "1.46.3"
criterion = "0.8"
wat = "1"

[[bench]]
name = "safety_check"
harness = false

[[bench]]
name = "safety_pipeline"
harness = false

[features]
default = ["postgres", "libsql", "html-to-markdown"]
postgres = [
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls-native-certs",
    "dep:postgres-types",
    "dep:refinery",
    "dep:pgvector",
    "rust_decimal/db-tokio-postgres",
]
libsql = ["dep:libsql"]
# Opt-in feature for especially heavy integration-test targets that run in a
# dedicated CI job instead of the default Rust test matrix.
integration = []
html-to-markdown = ["dep:html-to-markdown-rs", "dep:readabilityrs"]
import = ["dep:json5", "libsql"]

[[test]]
name = "e2e_thread_scheduling"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_eager_init"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_interrupt_ingress"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_channel_delivery"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_irc_wasm"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_wasm_tool"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_mcp_compatibility"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_skill_selection"
required-features = ["libsql", "integration"]

[[test]]
name = "engine_v2_tensorzero_streaming"
required-features = ["libsql", "integration"]

[[test]]
name = "html_to_markdown"
required-features = ["html-to-markdown"]

[profile.release]
strip = true          # Remove debug symbols from release binaries


# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"           # Full cross-crate LTO (slow build, better codegen)
codegen-units = 1     # Single codegen unit for maximum optimization

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# Ignore out-of-date generated CI so custom release.yml jobs are allowed
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "msi"]
# Publish jobs to run in CI
publish-jobs = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".tar.gz"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Which actions to run on pull requests
pr-run-mode = "skip"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
# Cache intermediate build artifacts to speed up the release pipelines
cache-builds = true

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-unknown-linux-musl = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-14"
