[dependencies.ahash]
version = "0.8"
features = [
    "std",
    "compile-time-rng",
]
default-features = false

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.base64]
version = "0.23"

[dependencies.bitflags]
version = "2"

[dependencies.html-escape]
version = "0.2.15"

[dependencies.html5ever]
version = "0.40.1"

[dependencies.image]
version = "0.25"
features = [
    "gif",
    "jpeg",
    "png",
    "bmp",
    "webp",
]
optional = true
default-features = false

[dependencies.memchr]
version = "2"

[dependencies.once_cell]
version = "1.21"

[dependencies.phf]
version = "0.14"
features = ["macros"]

[dependencies.regex]
version = "1.13"

[dependencies.rmcp]
version = "3.5.0"
features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "server-side-http",
]
optional = true

[dependencies.schemars]
version = "1.2.2"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.thiserror]
version = "2.0"

[dependencies.tl]
version = "0.8.0"
package = "astral-tl"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
    "io-std",
]
optional = true

[dependencies.tower]
version = "0.5"
features = [
    "limit",
    "timeout",
]
optional = true
default-features = false

[dependencies.tower-http]
version = "0.7"
features = ["limit"]
optional = true
default-features = false

[dependencies.tracing]
version = "0.1"

[dependencies.url]
version = "2.5"

[dev-dependencies.comrak]
version = "0.55.0"
default-features = false

[dev-dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies.serde_json]
version = "1.0"

[dev-dependencies.toml]
version = "1.1"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

[lints.clippy.all]
level = "deny"
priority = -1

[lints.clippy.arc_with_non_send_sync]
level = "allow"
priority = 1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.cargo_common_metadata]
level = "allow"
priority = 1

[lints.clippy.derivable_impls]
level = "allow"
priority = 1

[lints.clippy.multiple_crate_versions]
level = "allow"
priority = 1

[lints.clippy.needless_borrows_for_generic_args]
level = "allow"
priority = 1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.unnecessary_cast]
level = "allow"
priority = 1

[lints.clippy.unnecessary_fallible_conversions]
level = "allow"
priority = 1

[lints.clippy.unnecessary_wraps]
level = "allow"
priority = 1

[lints.clippy.unused_unit]
level = "allow"
priority = 1

[lints.clippy.unwrap_or_default]
level = "allow"
priority = 1

[lints.clippy.useless_conversion]
level = "allow"
priority = 1

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(alef)",
    'cfg(feature, values("testkit"))',
]
