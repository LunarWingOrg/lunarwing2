[package]
name = "lunarwing_skills"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
description = "Skill selection, scoring, and management for LunarWing"
authors = ["LunarWing Team"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/LunarWingOrg/lunarwing"
repository = "https://github.com/LunarWingOrg/lunarwing"
publish = false

[package.metadata.dist]
dist = false

[features]
default = ["registry", "catalog"]
registry = ["dep:tempfile"]
catalog = ["dep:reqwest", "dep:urlencoding", "dep:futures", "dep:lunarwing_safety"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "process", "fs"] }
tracing = "0.1"

# Optional (catalog feature)
futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"], optional = true }
urlencoding = { version = "2", optional = true }
# Leak detection for the B-3 publish path (defense-in-depth before sending skill
# bodies to the registry). Sibling workspace crate.
lunarwing_safety = { path = "../lunarwing_safety", version = "2.0.0", optional = true }

# Optional (registry feature — tempfile needed for dev-dep in tests, but also
# the registry module itself uses no extra deps beyond tokio::fs)
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
