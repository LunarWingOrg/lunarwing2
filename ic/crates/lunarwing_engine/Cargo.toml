[package]
name = "lunarwing_engine"
version = "2.1.6"
edition = "2024"
rust-version = "1.96.1"
description = "Unified thread-capability-CodeAct execution engine for LunarWing"
authors = ["LunarWing Team"]
license = "AGPL-3.0-or-later"
homepage = "https://git.lunarwing.org/lunarwing/lunarwing2"
repository = "https://git.lunarwing.org/lunarwing/lunarwing2"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
async-trait = "0.1"
futures = "0.3"
lunarwing_common = { path = "../lunarwing_common", version = "2.1.6" }
lunarwing_safety = { path = "../lunarwing_safety", version = "2.1.6" }
lunarwing_skills = { path = "../lunarwing_skills", version = "2.1.6", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
monty = { git = "https://github.com/pydantic/monty.git", rev = "5c7cf2b62be8e4421a4828072d41ebe69328bbf2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["full", "test-util"] }
