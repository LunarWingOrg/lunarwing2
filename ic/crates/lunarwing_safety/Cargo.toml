[package]
name = "lunarwing_safety"
version = "2.2.0"
edition = "2024"
rust-version = "1.96.1"
description = "Prompt injection defense, input validation, secret leak detection, and safety policy enforcement"
authors = ["LunarWing Team"]
license = "AGPL-3.0-or-later"
homepage = "https://git.lunarwing.org/lunarwing/lunarwing2"
repository = "https://git.lunarwing.org/lunarwing/lunarwing2"
publish = false

[package.metadata.dist]
dist = false

[features]
# Test-only surface (WI#633): lets a test that registers a fixture secret with
# a shared `LogScrubber` unregister it again. Only dev-dependencies of other
# crates enable this, so a shipped binary has no secret-removal path at all.
test-support = []

[dependencies]
aho-corasick = "1"
regex = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
