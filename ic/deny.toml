[advisories]
# WI#360 (2026-10-17): unsound is a separate cargo-deny 0.20.2 scope whose
# default is "workspace" (direct deps of workspace members only). With that
# default, transitive unsound advisories never fire in any gate. Set "all"
# so every unsound finding must now be fixed, or accepted with an ID ignore
# plus a [bans] restriction that limits the acceptance to the specific
# crate and graph position it applies to — including atty
# (RUSTSEC-2021-0145, Windows-only unaligned read, reached transitively
# via the vendored libsignal-protocol dev-dep env_logger 0.6.2). The entry
# is explicitly ignored below with its own clearing owner and a [bans]
# restriction limiting atty to env_logger and env_logger to libsignal-protocol.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    # Baseline accepted advisories re-verified against upstream 2026-10-10
    # for v2.1.6.0; WI#409's rustls additions are dated 2026-10-14 below.
    # Baseline clearing decisions were owned by work item WI#331
    # (https://git.lunarwing.org/lunarwing/lunarwing2/-/work_items/331);
    # WI#304 was closed without a migration, so do not reference it as a
    # clearing owner. WI#331 and WI#409 are now both closed as well; the
    # seven libsql 0.6.0 legacy-chain acceptances they left behind
    # (rustls-webpki 0.102 / h2 0.3.27 / rustls 0.22.4 entries below) stand
    # under the WI#418 standing decision record
    # docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (2026-10-16), which
    # supersedes the closed WI#331/WI#409 records for those entries.
    # Clearing work that outlived WI#331 was split into follow-ups cited
    # per entry: WI#367 (libsignal-protocol off failure/rental/atty),
    # WI#368 (rsa policy / upstream tracking), and WI#418 (libsql legacy
    # chain). Re-verify each exposure note at every release per the
    # protocol in the WI#418 decision record. Historical decision record:
    # docs/ops/v2.1.6.0_WI331_ADVISORY_CLEARING.md. Audit trails:
    # docs/ops/v2.1.6.0_CARGO_DENY_AUDIT.md (v2.1.6.0),
    # docs/ops/v2.1.5.0_CARGO_DENY_AUDIT.md (v2.1.5.0).
    # Remove an entry only when its clearing upgrade has landed
    # in Cargo.lock AND the corresponding lockfile root has been re-checked
    # with `--config` overrides so the advisory surfaces as a hard error if
    # it ever comes back.

    # rustls-webpki 0.102.8 chain via libsql 0.6.0 -> hyper-rustls 0.25.0 ->
    # rustls 0.22.4. Re-verified 2026-10-16 (WI#418): libsql 0.10.0 went
    # stable 2026-10-13 and still requests hyper-rustls ^0.25, hyper ^0.14,
    # and tonic ^0.11, so even a libsql bump today would keep this chain;
    # no 0.102-line webpki patch exists (advisory patched ranges start at
    # 0.103.x). Clearing requires an upstream libsql release that adopts
    # rustls 0.23 / hyper-rustls 0.27+, or a driver migration — WI#331
    # resolved on the mitigation below and WI#418 adopted it as the
    # standing long-term decision (see the decision record).
    # MITIGATION (v2.1.6.0, WI#331): libsql's remote/replication/tls features
    # moved behind the non-default `libsql-remote-replica` cargo feature, so
    # default builds no longer compile this chain at all; the default-feature
    # graph is pinned clean by .gitlab/scripts/check-default-graph-advisories.sh.
    # EXPOSURE: only in opt-in `--features libsql-remote-replica` builds —
    # this copy of webpki is the X.509 validator for libSQL remote-replica
    # TLS connections (LIBSQL_URL set; ic/src/db/libsql/mod.rs
    # new_remote_replica), i.e. TLS to a third-party database host validated
    # with known name-constraint bypasses (2026-0098/0099). Default and
    # postgres-only builds do not contain it. The ignores remain required
    # because CI's cargo-deny gate queries --workspace --all-features, which
    # enables the opt-in feature.
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 CRL distributionPoint matching; pinned by libsql 0.6.0 legacy chain; libsql 0.10.0 stable (2026-10-13) still pulls hyper-rustls ^0.25 and no 0.102-line patch exists; exposure: opt-in libsql-remote-replica builds only, default builds cleared by WI#331 feature gate; residual opt-in exposure accepted per WI#418 standing decision record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16; supersedes the closed WI#331/WI#409 records); clearing owner WI#418" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 URI name constraints; same libsql 0.6.0 legacy chain and opt-in-only exposure as RUSTSEC-2026-0049; residual opt-in exposure accepted per WI#418 standing decision record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16); clearing owner WI#418" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 wildcard name-constraint bypass; same libsql 0.6.0 legacy chain and opt-in-only exposure as RUSTSEC-2026-0049; residual opt-in exposure accepted per WI#418 standing decision record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16); clearing owner WI#418" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 CRL parsing panic; same libsql 0.6.0 legacy chain and opt-in-only exposure as RUSTSEC-2026-0049; residual opt-in exposure accepted per WI#418 standing decision record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16); clearing owner WI#418" },
    # RUSTSEC-2026-0382 (CVE-2026-111943, published 2026-10-20): certificate
    # verification may accept distrusted emSign intermediates. Patched ranges
    # are 0.103.16 / 0.104.0-alpha.8 only — no 0.102-line patch exists, same
    # as every prior 0.102 advisory above. The modern 0.103 copy is upgraded
    # to 0.103.16 (2026-10-20, item 28); only the libsql 0.6.0 legacy chain
    # copy remains, behind the same opt-in libsql-remote-replica gate.
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 accepts distrusted emSign intermediate certificate paths (CVE-2026-111943); same libsql 0.6.0 legacy chain and opt-in-only exposure as RUSTSEC-2026-0049 — no 0.102-line patch exists (patched ranges start at 0.103.16); the modern 0.103 line is fixed at 0.103.16; residual opt-in exposure accepted per WI#418 standing decision record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (verified 2026-10-20); clearing owner WI#418" },

    # WI#409 (2026-10-14): the modern rustls line is upgraded to 0.23.46,
    # fixing RUSTSEC-2026-0346/0347/0348/0349. No patched 0.22 release exists.
    # rustls 0.22.4 remains only via libsql 0.6.0 -> hyper-rustls 0.25.0 ->
    # tokio-rustls 0.25.0, behind WI#331's opt-in libsql-remote-replica gate.
    # EXPOSURE: remote-replica TLS only; default/postgres-only builds exclude
    # it. No custom ClientSessionStore logs session values in our sources
    # (0346); 0349 concerns unauthenticated key-exchange hints in the session
    # store, not certificate authentication. Accept the legacy chain only.
    # Decision record: WI#418 standing record
    # docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (2026-10-16),
    # superseding the closed WI#409 acceptance record (WI#409 delivered the
    # 0.23.46 upgrade, not a chain clearing); clearing owner: WI#418.
    # Re-verified 2026-10-16: libsql 0.10.0 stable still keeps the chain
    # (hyper-rustls ^0.25 / hyper ^0.14 / tonic ^0.11).
    # The default-graph guard pins 0.22.4 out of shipped builds; the rustls
    # version floor below prevents ID-keyed ignores masking a 0.23 downgrade.
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.22.4 session-value Debug exposes TLS secrets; libsql 0.6.0 legacy chain, no 0.22-line patch; no custom ClientSessionStore in LunarWing sources; exposure accepted only for opt-in libsql-remote-replica builds under WI#331 feature gate; modern line fixed at 0.23.46; decision record WI#418 standing record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16; supersedes closed WI#409), clearing owner WI#418" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.22.4 unauthenticated ServerHello key-exchange hint caching; same libsql 0.6.0 legacy chain, no 0.22-line patch; exposure accepted only for opt-in libsql-remote-replica builds under WI#331 feature gate, default/postgres-only builds exclude it; modern line fixed at 0.23.46; decision record WI#418 standing record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16; supersedes closed WI#409), clearing owner WI#418" },

    # failure crate — vendored libsignal-protocol path dep only.
    # failure 0.1.8 is the final release (EOL); clearing requires porting
    # the vendored wrapper off failure/failure_derive (dozens of uses across
    # the vendored crate — a dedicated follow-up item, not a version bump).
    # EXPOSURE: compiled into every feature set; reached via the XMPP OMEMO
    # implementation (ic/src/channels/xmpp/omemo/) that links the vendored
    # libsignal-protocol wrapper — a LunarWing-owned path dependency, so the
    # pin is our own choice, not purely upstream's.
    # Clearing owner: WI#367 (split out of WI#331).
    { id = "RUSTSEC-2019-0036", reason = "failure crate EOL type-confusion; vendored libsignal-protocol 0.1.0 path dep (XMPP OMEMO), every feature set; failure 0.1.8 is the final release; clearing owner WI#367, decision record WI#331 (re-verified 2026-10-10)" },
    { id = "RUSTSEC-2020-0036", reason = "failure crate officially unmaintained; same vendored libsignal-protocol chain and exposure as RUSTSEC-2019-0036; clearing owner WI#367, decision record WI#331 (re-verified 2026-10-10)" },

    # rsa Marvin timing side channel via russh -> rsa 0.10.0-rc.18.
    # Re-verified 2026-10-10: the advisory still declares patched = [];
    # rsa 0.10.0-rc.19 is published but not marked patched, and russh
    # 0.64.1 (latest) still requests rsa =0.10.0-rc.18 as an optional dep,
    # so a russh bump does not clear the advisory. Clearing requires an
    # upstream constant-time rsa release or a LunarWing policy change
    # (reject RSA key material by parsed algorithm, drop the russh/rsa
    # feature — only russh and ssh-key pull rsa in).
    # EXPOSURE (corrected per MR !1505 review CP-3): compiled into every
    # feature set because LunarWing itself enables the russh "rsa" feature
    # (ic/Cargo.toml). The built-in ssh tool refuses RSA by declared
    # key-type label only, and the label check is bypassable. The live
    # path is the tenant SSH agent: ic/src/bridge/ssh.rs loads every
    # configured host key into SshAgentServer with no algorithm filter,
    # ssh_agent.rs auto-confirms signing requests, the socket is mode
    # 0o666, and lunarwing-mt-admin.sh mounts it into the (untrusted)
    # opencode/opencode2/pebble worker containers. Signing is unblinded
    # (rng = None) — unlimited chosen-message RSA signatures with local
    # timing for any tenant that configures an RSA host key.
    # Clearing owner: WI#368 (split out of WI#331).
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.18 Marvin timing attack; patched = [] (re-verified 2026-10-10); rc.19 published but not marked patched; russh 0.64.1 still pins rsa =0.10.0-rc.18; exposure: tenant SSH agent (auto-confirm, 0o666) mounted into untrusted worker containers signs with RSA host keys; LunarWing-enabled russh/rsa feature, every feature set; clearing owner WI#368, decision record WI#331" },

    # h2 empty DATA frames — low severity. The patched 0.4.20 is locked; the
    # remaining 0.3.27 copy is unpatchable upstream (0.3 line ended at 0.3.27)
    # and is reached only via the legacy libsql 0.6.0 -> tonic 0.11 -> hyper 0.14
    # chain, same mitigation and WI#418 standing decision as the webpki
    # entries above (re-verified 2026-10-16: libsql 0.10.0 stable still
    # requests tonic ^0.11 / hyper ^0.14).
    # EXPOSURE: only in opt-in `--features libsql-remote-replica` builds;
    # default and postgres-only builds do not contain it, and the
    # default-feature graph is pinned clean by
    # .gitlab/scripts/check-default-graph-advisories.sh.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 pinned by libsql 0.6.0 legacy chain; no 0.3-line patch exists; 0.4 line upgraded to 0.4.20; exposure: opt-in libsql-remote-replica builds only, default builds cleared by WI#331 feature gate; residual opt-in exposure accepted per WI#418 standing decision record docs/ops/v2.1.6.0_WI418_LIBSQL_LEGACY_CHAIN.md (re-verified 2026-10-16); clearing owner WI#418" },

    # RUSTSEC-2026-0381 (webpki-roots 0.26.11 shim) — acceptance REMOVED by the
    # v2.1.7.0 crate-security audit (2026-10-24, advisory-db 21d909e4): that
    # database revision marks the 0.26.11 compatibility shim `unaffected`
    # (`unaffected = ["= 0.26.11"]`), because the shim carries no independent
    # trust store and re-exports the roots of its separately resolved
    # webpki-roots 1.x dependency, pinned at the patched 1.0.10. The shim
    # itself remains reachable only through the opt-in
    # libsql-remote-replica legacy chain, and a downgrade of the 1.x parent
    # is still a hard failure (the same advisory matches the 1.x package it
    # resolves to). The ignore was producing `warning[advisory-not-detected]`
    # on every gate run — a stale acceptance, not a live exposure.

    # rental — unmaintained (informational, no vulnerability). Only visible
    # since the gate widened to --workspace --all-features (v2.1.5.0, MR
    # !1371 review A4): direct dep of the vendored libsignal-protocol
    # workspace member behind its "crypto-openssl" feature. Clearing means
    # porting the vendored wrapper off rental, same follow-up as failure.
    # Clearing owner: WI#367 (split out of WI#331).
    { id = "RUSTSEC-2021-0134", reason = "rental unmaintained (informational, no vulnerability); vendored libsignal-protocol crypto-openssl feature; visible only in the --workspace --all-features graph; clearing owner WI#367, decision record WI#331 (accepted 2026-10-03, re-verified 2026-10-10)" },

    # atty — unsound (WI#360, 2026-10-17). Invisible to every gate while
    # unsound kept its "workspace" default: atty is a transitive dep only
    # (env_logger 0.6.2 -> atty 0.2.14), and the default scope reports
    # advisories only for direct workspace deps. Widening unsound to "all"
    # surfaces it, so it needs an explicit acceptance here. The crate is
    # Windows-only vulnerable (unaligned read on the console handle) and
    # has no patched release; it reaches ic/Cargo.lock solely as a dev-dep
    # of the vendored libsignal-protocol workspace member, never a
    # production edge. Production-graph absence is enforced by
    # .gitlab/scripts/check-lockfile-only-advisories.sh (atty, no-dev mode,
    # RUSTSEC-2021-0145): it fails if atty ever resolves into a non-dev
    # build graph and goes stale if the pin leaves the lockfile. The
    # [bans] section limits the acceptance to this exact graph position
    # (atty only under env_logger, env_logger <0.10.0 only under the
    # vendored libsignal-protocol).
    # Clearing owner: WI#367 (libsignal-protocol dev-dep chain port; same
    # owner as failure/rental above — clearing also drops the env_logger
    # 0.6.2 dev-dep edge, which removes atty from the lock; the JH-2
    # review extends WI#367's summary and acceptance criteria to atty).
    { id = "RUSTSEC-2021-0145", reason = "atty 0.2.14 unsound (Windows-only unaligned read, no patched release); dev-graph only via vendored libsignal-protocol dev-dep env_logger 0.6.2; production-graph absence enforced by check-lockfile-only-advisories.sh no-dev; [bans] restricts atty to env_logger and env_logger <0.10.0 to libsignal-protocol; clearing owner WI#367" },
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    # Version floors protecting the patched copies of advisory-pinned crates
    # against silent downgrade (MR !1371 review A3): the advisory ignores
    # above are keyed by ID, which would not fire if a future lockfile
    # regressed the PATCHED line below the fixed release. The legacy copies
    # (h2 0.3.27, rustls 0.22.4, rustls-webpki 0.102.8, webpki-roots 0.26.11)
    # sit outside these ranges and remain governed by the accepted advisories.
    { name = "h2", version = ">=0.4.0, <0.4.19" },
    { name = "rustls", version = ">=0.23.0, <0.23.46" },
    { name = "rustls-webpki", version = ">=0.103.0, <0.103.16" },
    # CVE-2026-111943 (2026-10-20, item 28): the patched webpki root-store
    # lines are webpki-roots 1.0.10 / webpki-root-certs 1.0.10; deny every
    # earlier release (webpki-roots 0.26.11 is the accepted legacy pin below).
    { name = "webpki-root-certs", version = "<1.0.10" },
    { name = "webpki-roots", version = ">=1.0.0, <1.0.10" },
    # WI#418 (IS-1): ID-keyed ignores also suppress findings for other
    # affected copies. Permit only the four accepted legacy pins below
    # the modern lines; a new dependency must not inherit the acceptance.
    { name = "h2", version = "<0.3.27" },
    { name = "h2", version = ">0.3.27, <0.4.0" },
    { name = "rustls", version = "<0.22.4" },
    { name = "rustls", version = ">0.22.4, <0.23.0" },
    { name = "rustls-webpki", version = "<0.102.8" },
    { name = "rustls-webpki", version = ">0.102.8, <0.103.0" },
    { name = "webpki-roots", version = "<0.26.11" },
    { name = "webpki-roots", version = ">0.26.11, <1.0.0" },
    # Only libsql may depend directly on this legacy TLS-chain root.
    { name = "hyper-rustls", version = "=0.25.0", wrappers = ["libsql"] },
    # WI#360 (JH-1): the RUSTSEC-2021-0145 ignore is keyed by ID, so it would
    # also accept atty in any other root or graph position. Only the vendored
    # libsignal-protocol dev-dep env_logger 0.6.2 may pull it. Per the
    # crates.io index only env_logger 0.5.2–0.9.3 depends on atty, so
    # "<0.10.0" covers every atty-pulling release; the older pre-0.5.2
    # releases are banned too, which fails closed.
    { name = "atty", wrappers = ["env_logger"] },
    { name = "env_logger", version = "<0.10.0", wrappers = ["libsignal-protocol"] },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = [
    "https://github.com/pydantic/monty.git",
    "https://github.com/astral-sh/ruff.git",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
