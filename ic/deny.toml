[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Pre-existing advisories — tracked for upgrade in separate PRs
    # rustls-webpki CRL distributionPoint matching — 0.102.8 pinned by libsql transitive dep
    "RUSTSEC-2026-0049",
    { id = "RUSTSEC-2019-0036", reason = "failure crate EOL; vendored libsignal-protocol dependency, no patch" },
    { id = "RUSTSEC-2020-0036", reason = "failure crate EOL; no patch" },
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack; no upstream constant-time release yet" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 constrained by rustls 0.22 via libsql 0.6.0; blocked on upstream libsql release supporting rustls 0.23" },
    { id = "RUSTSEC-2026-0099", reason = "same as RUSTSEC-2026-0098" },
    { id = "RUSTSEC-2026-0104", reason = "same as RUSTSEC-2026-0098" },
    # h2 empty DATA frames — low severity. The patched 0.4.16 is locked; the
    # remaining 0.3.27 copy is unpatchable upstream (0.3 line ended at 0.3.27)
    # and is reached only via the legacy libsql 0.6.0 -> tonic 0.11 -> hyper 0.14
    # chain, same block as the webpki entries above.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 pinned by libsql 0.6.0 legacy chain; no 0.3-line patch exists; 0.4 line upgraded to 0.4.16" },
]

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-git = [
    "https://github.com/pydantic/monty.git",
    "https://github.com/astral-sh/ruff.git",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
