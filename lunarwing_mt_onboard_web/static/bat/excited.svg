<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- Wings spread upward -->
  <polygon points="28,36 6,12 2,22 10,30 16,28 22,34 28,38"
           fill="#0D47A1" stroke="url(#wingGrad)" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="72,36 94,12 98,22 90,30 84,28 78,34 72,38"
           fill="#0D47A1" stroke="url(#wingGrad)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Ears -->
  <polygon points="34,32 38,16 44,30" fill="#0D47A1"/>
  <polygon points="56,30 62,16 66,32" fill="#0D47A1"/>
  <polygon points="36,30 39,20 42,28" fill="#1565C0"/>
  <polygon points="58,28 61,20 64,30" fill="#1565C0"/>

  <!-- Body -->
  <ellipse cx="50" cy="52" rx="22" ry="24" fill="#0D47A1"/>

  <!-- Wide eyes -->
  <circle cx="42" cy="48" r="6" fill="#B3E5FC"/>
  <circle cx="58" cy="48" r="6" fill="#B3E5FC"/>
  <circle cx="42" cy="48" r="3.5" fill="#0D47A1"/>
  <circle cx="58" cy="48" r="3.5" fill="#0D47A1"/>

  <!-- Highlight dots -->
  <circle cx="44" cy="46" r="1.5" fill="#FFFFFF"/>
  <circle cx="60" cy="46" r="1.5" fill="#FFFFFF"/>

  <!-- Big open grin -->
  <ellipse cx="50" cy="62" rx="8" ry="5" fill="#B3E5FC"/>
  <rect x="44" y="60" width="12" height="3" rx="1" fill="#0D47A1"/>

  <!-- Blush cheeks -->
  <circle cx="36" cy="56" r="2" fill="#E64C4C" opacity="0.3"/>
  <circle cx="64" cy="56" r="2" fill="#E64C4C" opacity="0.3"/>
</svg>
