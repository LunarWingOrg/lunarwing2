ci-config:
  extends: .lint-job
  stage: validate
  needs: []
  before_script:
    - python3 -m pip install --no-deps PyYAML==6.0.3
  script:
    - python3 .gitlab/scripts/validate_config.py
    - python3 -m unittest discover -s .gitlab/tests -p 'test_*.py'
    - python3 .gitlab/scripts/verify_release_version.py --self-test
    - python3 .gitlab/scripts/promote-worker-image.py self-test

shell-syntax:
  extends: .shell-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/shell-syntax.sh

python-syntax:
  extends: .shell-job
  stage: validate
  needs: []
  script:
    - python3 .gitlab/scripts/python_syntax.py

registry-json:
  extends: .lint-job
  stage: validate
  needs: []
  script:
    - python3 .gitlab/scripts/registry_json.py

version-policy:
  extends: .shell-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/version-policy.sh

panic-policy:
  extends: .shell-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/panic-policy.sh

# WI#328 (MR !1537 review DW-9): the opencode worker's TS bridge/executor
# previously had no MR-pipeline gate at all — the only bun run was the manual
# worker image build. This lane runs every bun self-test plus a strict
# `tsc --noEmit` with pinned types on each MR/push.
worker-opencode-ts:
  stage: validate
  needs: []
  image:
    # Same digest-pinned bun base as opencode4lunarwing/Dockerfile's builder.
    name: "docker.io/oven/bun:debian@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - cd opencode4lunarwing
    - bun install --frozen-lockfile
    - bun scripts/path_expand_test.ts
    - bun scripts/opencode_result_test.ts
    - bun scripts/task_prompt_test.ts
    - bun scripts/lunarwing_bridge_test.ts
    - bun scripts/opencode_task_executor_test.ts
    - ./node_modules/.bin/tsc --noEmit -p scripts/tsconfig.json

rustfmt:
  extends: .rust-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/cargo-ci.sh fmt --all -- --check

cargo-metadata:
  extends: .rust-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/cargo-ci.sh metadata --locked --no-deps --format-version 1

release-version:
  extends: .lint-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  script:
    - python3 .gitlab/scripts/verify_release_version.py
