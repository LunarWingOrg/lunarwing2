ci-config:
  extends: .lint-job
  stage: validate
  needs: []
  before_script:
    - python3 -m pip install --no-deps PyYAML==6.0.3
  script:
    - python3 .gitlab/scripts/validate_config.py
    - python3 -m unittest discover -s .gitlab/tests -p 'test_*.py'
    - python3 .gitlab/scripts/verify_release_version.py --self-test
    - python3 .gitlab/scripts/promote-worker-image.py self-test

shell-syntax:
  extends: .shell-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/shell-syntax.sh

python-syntax:
  extends: .shell-job
  stage: validate
  needs: []
  script:
    - python3 .gitlab/scripts/python_syntax.py

registry-json:
  extends: .lint-job
  stage: validate
  needs: []
  script:
    - python3 .gitlab/scripts/registry_json.py

version-policy:
  extends: .shell-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/version-policy.sh

panic-policy:
  extends: .shell-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/panic-policy.sh

# WI#328 (MR !1537 review DW-9): the opencode worker's TS bridge/executor
# previously had no MR-pipeline gate at all — the only bun run was the manual
# worker image build. This lane runs every bun self-test plus a strict
# `tsc --noEmit` with pinned types on each MR/push.
worker-opencode-ts:
  stage: validate
  needs: []
  image:
    name: "$CI_BUN_IMAGE"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - cd opencode4lunarwing
    - bun install --frozen-lockfile
    - bun scripts/path_expand_test.ts
    - bun scripts/opencode_result_test.ts
    - bun scripts/task_prompt_test.ts
    - bun scripts/lunarwing_bridge_test.ts
    - bun scripts/lunarwing_tool_proxy_test.ts
    - bun scripts/lunarwing_tool_plugin_test.ts
    - bun scripts/opencode_task_executor_test.ts
    - ./node_modules/.bin/tsc --noEmit -p scripts/tsconfig.json

# WI#324 (MR !1590 review GB-2): the kimi worker TS suites previously ran only
# in the manual protected candidate image build, so bridge/tool-proxy
# regressions reached main without any MR-pipeline execution. This lane runs
# the Dockerfile builder stage's npm ci + tsc + npm test sequence on each
# MR/push, on the same digest-pinned node image. The bare
# node:22-bookworm-slim image has no python3, so the lane first installs the
# builder stage's python3 apt prerequisite (Dockerfile: the entrypoint config
# tests run the entrypoint with bash and it embeds python3 heredocs; without
# it five entrypoint tests fail with exit 127 — MR !1601 review GH-1) from
# the same pinned Debian snapshot the image builds with (CI_DEBIAN_SNAPSHOT,
# tied to the Dockerfile ARG by validate_config.py — MR !1618 review GV-4),
# not the live deb.debian.org mirror. The
# real-CLI contract lane (kimi_cli_contract_test) self-skips here — no kimi
# binary — and the protected image build remains the only place it executes
# against the real CLI. (MR !1618 review GV-5: the closed !1614 also added a
# worker-kimi-ts job; this is the single definition the re-attempt reuses.)
worker-kimi-ts:
  stage: validate
  needs: []
  image:
    name: "$CI_NODE_IMAGE"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    # Builder-stage prerequisite (kimicode4lunarwing/Dockerfile): the
    # entrypoint_config_test.js cases bash-run entrypoint.sh, whose config
    # section embeds python3 heredocs; the bare node image lacks python3.
    # Install it from the pinned CI_DEBIAN_SNAPSHOT archive (tied to the
    # Dockerfile ARG DEBIAN_SNAPSHOT), mirroring the builder stage's apt
    # source setup — not from the live deb.debian.org mirror (GV-4).
    # snapshot.debian.org is a best-effort, throttled service, so both the
    # update and the install fetches retry; an outage still fails the lane
    # until the service recovers (MR !1627 review HE-4, MR !1644 review HN-8).
    - rm -f /etc/apt/sources.list.d/debian.sources
    - printf '%s\n' "deb http://snapshot.debian.org/archive/debian/${CI_DEBIAN_SNAPSHOT}/ bookworm main" "deb http://snapshot.debian.org/archive/debian/${CI_DEBIAN_SNAPSHOT}/ bookworm-updates main" "deb http://snapshot.debian.org/archive/debian-security/${CI_DEBIAN_SNAPSHOT}/ bookworm-security main" > /etc/apt/sources.list
    - apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update && apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y --no-install-recommends python3
    - cd kimicode4lunarwing/scripts
    - npm ci --ignore-scripts
    - npx tsc -p tsconfig.json
    - npm test

# WI#375 DR-3: the opencode2 bridge's dependency-free TS suites previously
# gated only at the (protected) worker image build. The executor suite needs
# the image's built @opencode/client and stays image-gated. Pinned by
# validate_config.py like the other worker TS lanes (WORKER_TS_LANE_SCRIPTS).
worker-opencode2-ts:
  stage: validate
  needs: []
  image:
    name: "$CI_BUN_IMAGE"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - cd opencode2.4lunarwing
    - bun scripts/path_expand_test.ts
    - bun scripts/task_prompt_test.ts
    - bun scripts/opencode_result_test.ts

# WI#375 DR-3: pebble's Rust suite previously gated only at the (protected)
# worker image build (`cargo test --locked` in the Dockerfile). Pinned by
# validate_config.py (validate_pebble_rust_lane).
worker-pebble-rust:
  extends: .rust-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --manifest-path ../pebble4lunarwing/Cargo.toml

rustfmt:
  extends: .rust-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/cargo-ci.sh fmt --all -- --check

cargo-metadata:
  extends: .rust-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/cargo-ci.sh metadata --locked --no-deps --format-version 1

release-version:
  extends: .lint-job
  stage: validate
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
  script:
    - python3 .gitlab/scripts/verify_release_version.py
