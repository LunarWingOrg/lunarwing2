# Protected worker publication pipeline: immutable candidate -> digest scan/SBOM
# -> manual immutable release-tag promotion. No job here is created for an
# unprotected ref, and promotion never rebuilds or writes :latest.

.worker-candidate:
  image:
    # Trust-sensitive publication images are literal pins, not pipeline-overridable variables.
    name: "docker.io/moby/buildkit:v0.25.1-rootless@sha256:0c0ce4929976ace509f7a53878303504b2de8857829aea4932af9f7325a30f51"
    entrypoint: [""]
  tags:
    - container-build
  stage: containers
  interruptible: false
  retry: 0
  timeout: 8h
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "safe.directory"
    GIT_CONFIG_VALUE_0: "$CI_PROJECT_DIR"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      dotenv: worker-image.env
    paths:
      - worker-image.env
      - worker-image-metadata.json
      - worker-image-rebuild-metadata.json
      - worker-inputs.sha256
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never

.worker-scan:
  image:
    name: "docker.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
    entrypoint: [""]
  tags:
    - container-build
  stage: containers
  timeout: 2h
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
  script:
    - set -a; . ./worker-image.env; set +a
    - test -n "$WORKER_IMAGE_REF" && test -n "$WORKER_IMAGE_DIGEST"
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$WORKER_IMAGE_REF@$WORKER_IMAGE_DIGEST"
    - trivy image --ignorefile "$CI_PROJECT_DIR/.gitlab/trivy-ignore" --exit-code 1 --severity CRITICAL --format json --output worker-vulnerabilities.json "$WORKER_IMAGE_REF@$WORKER_IMAGE_DIGEST"
    - trivy image --format cyclonedx --output worker-sbom.cdx.json "$WORKER_IMAGE_REF@$WORKER_IMAGE_DIGEST"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - worker-vulnerabilities.json
      - worker-sbom.cdx.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never

.worker-promotion:
  image:
    name: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"
  tags:
    - container-build
  stage: containers
  interruptible: false
  retry: 0
  timeout: 30m
  script:
    - python3 .gitlab/scripts/promote-worker-image.py promote
  artifacts:
    expire_in: 1 year
    paths:
      - worker-image-evidence.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never

worker-pebble-candidate:
  extends: .worker-candidate
  script:
    - sh .gitlab/scripts/build-worker-image.sh pebble

worker-pebble-scan:
  extends: .worker-scan
  needs:
    - job: worker-pebble-candidate
      artifacts: true

worker-pebble-promote:
  extends: .worker-promotion
  variables:
    WORKER_PROMOTION_TAG: "$CI_COMMIT_TAG-pebble"
  resource_group: worker-pebble-promotion
  needs:
    - job: worker-pebble-candidate
      artifacts: true
    - job: worker-pebble-scan
      artifacts: true

