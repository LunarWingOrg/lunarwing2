# Protected worker publication pipeline: immutable candidate -> digest scan/SBOM
# -> manual immutable release-tag promotion. No job here is created for an
# unprotected ref, and promotion never rebuilds or writes :latest.

.worker-candidate:
  image:
    # Trust-sensitive publication images are literal pins, not pipeline-overridable variables.
    name: "docker.io/moby/buildkit:v0.25.1-rootless@sha256:0c0ce4929976ace509f7a53878303504b2de8857829aea4932af9f7325a30f51"
    entrypoint: [""]
  tags:
    - container-build
  stage: containers
  # Manual candidates must be playable without waiting for the Rust matrix.
  # Publication remains protected; release promotion still requires a scan.
  needs: []
  interruptible: false
  retry: 0
  timeout: 8h
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "safe.directory"
    GIT_CONFIG_VALUE_0: "$CI_PROJECT_DIR"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      dotenv: worker-image.env
    paths:
      - worker-image.env
      - worker-image-metadata.json
      - worker-image-rebuild-metadata.json
      - worker-inputs.sha256
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never

.worker-scan:
  image:
    name: "docker.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
    entrypoint: [""]
  tags:
    - container-build
  stage: containers
  timeout: 2h
  # Bounded auto-retry for transient scan flakes: pipeline 5263's
  # worker-opencode-scan was SIGKILLed (exit 137) by the runner host mid
  # SBOM call after both gates had already passed, and every such failure
  # needed a manual re-run. The scan is read-only (it publishes nothing)
  # and re-verifies the same immutable digest, so one automatic re-run
  # cannot promote anything a fresh manual run could not; a real CRITICAL
  # finding fails every attempt the same way. The publication jobs keep
  # their pinned retry: 0 — only the scan retries.
  retry:
    max: 1
    when: [always]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
  script:
    # The candidate publishes worker-image.env as a dotenv artifact. When the
    # candidate fails on the default branch (allow_failure: true there), this
    # job still runs and the raw source line below used to die with a cryptic
    # "can't open './worker-image.env'" (pipeline #3684). Fail with the actual
    # cause instead: a missing env file always means the candidate never
    # published an image.
    - |
      if [ ! -f ./worker-image.env ]; then
        echo "ERROR: worker-image.env is missing — the candidate job for this worker failed or did not publish an image." >&2
        echo "       Finish the matching worker-*-candidate job successfully before retrying this scan." >&2
        exit 1
      fi
    - set -a; . ./worker-image.env; set +a
    - test -n "$WORKER_IMAGE_REF" && test -n "$WORKER_IMAGE_DIGEST"
    # TRIVY_CACHE_DIR is inside the checkout, and trivy reuses any DB there
    # whose metadata says it is fresh: start from an empty cache so neither a
    # committed .trivy-cache nor a DB fetched by an earlier call can stand in
    # for the real one. Every call takes --config /dev/null, because the
    # first call fills the cache the gate then reuses (MR !1750 review).
    - rm -rf "$TRIVY_CACHE_DIR"
    - trivy image --config /dev/null --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$WORKER_IMAGE_REF@$WORKER_IMAGE_DIGEST"
    # --config /dev/null: trivy otherwise loads trivy.yaml from its working
    # directory (the checkout), which can set ignore-unfixed and hide every
    # unfixed CRITICAL with no expiry (WI#361).
    - trivy image --config /dev/null --ignorefile "$CI_PROJECT_DIR/.gitlab/trivy-ignore" --exit-code 1 --severity CRITICAL --format json --output worker-vulnerabilities.json "$WORKER_IMAGE_REF@$WORKER_IMAGE_DIGEST"
    - trivy image --config /dev/null --format cyclonedx --output worker-sbom.cdx.json "$WORKER_IMAGE_REF@$WORKER_IMAGE_DIGEST"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - worker-vulnerabilities.json
      - worker-sbom.cdx.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      # One manual action per worker: the scan follows its candidate.
      when: on_success
      allow_failure: true
    - when: never

.worker-promotion:
  image:
    name: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"
  tags:
    - container-build
  stage: containers
  interruptible: false
  retry: 0
  timeout: 30m
  before_script:
    # Pre-flight the registry auth realm from the job container (not BuildKit):
    # a broken/misconfigured realm would otherwise only surface as a cryptic
    # "realm is not a trusted HTTPS origin" after the multi-hour candidate and
    # scan jobs already ran. Timing out here keeps the failure cheap and
    # intentional, before any manifest is touched.
    - python3 .gitlab/scripts/registry-realm-smoke.py
  script:
    - python3 .gitlab/scripts/promote-worker-image.py promote
  artifacts:
    expire_in: 1 year
    paths:
      - worker-image-evidence.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never

worker-pebble-candidate:
  extends: .worker-candidate
  script:
    - sh .gitlab/scripts/build-worker-image.sh pebble

worker-pebble-scan:
  extends: .worker-scan
  needs:
    - job: worker-pebble-candidate
      artifacts: true

worker-pebble-promote:
  extends: .worker-promotion
  variables:
    WORKER_PROMOTION_TAG: "$CI_COMMIT_TAG-pebble"
  resource_group: worker-pebble-promotion
  needs:
    - job: worker-pebble-candidate
      artifacts: true
    - job: worker-pebble-scan
      artifacts: true

