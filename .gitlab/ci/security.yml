cargo-deny:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/install-cargo-deny.sh
    - bash .gitlab/scripts/cargo-deny-check.sh

# Makes the release audit's "every committed lockfile is clean" claim
# reproducible in CI: the same pinned cargo-deny over every manifest root
# with a tracked Cargo.lock, not just the ic workspace (MR !1371 review A5).
satellite-advisory-sweep:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/install-cargo-deny.sh
    - bash .gitlab/scripts/check-satellite-advisories.sh

# cargo-deny filters crates that are pinned in Cargo.lock but never resolved
# into the built graph, so advisories against such pins stay invisible. This
# guard fails loudly if one of those pins ever starts compiling.
lockfile-only-advisory-guard:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/check-lockfile-only-advisories.sh

# The WI#331 mitigation keeps the libsql 0.6.0 legacy chain (rustls-webpki
# 0.102.8, h2 0.3.27) out of default-feature builds behind the opt-in
# libsql-remote-replica cargo feature. Every deny gate queries
# --workspace --all-features with ID-keyed ignores, so none of them can see
# this regression; this guard pins the default-feature production graph
# clean (MR !1513 review CZ-1).
default-graph-advisory-guard:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/check-default-graph-advisories.sh

secret-detection:
  extends: .gitleaks-job
  stage: security
  needs: []
  script:
    - bash .gitlab/scripts/scan-secrets.sh

# Owner: security maintainers. Remove allow_failure after historical findings are triaged.
secret-history:
  extends:
    - .gitleaks-job
    - .observational-job
  stage: security
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  script:
    - gitleaks git --redact=100 --no-banner --no-color --log-opts="--all" .
