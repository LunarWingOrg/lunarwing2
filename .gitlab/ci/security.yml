cargo-deny:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - job: cargo-metadata
      artifacts: false
  script:
    - bash .gitlab/scripts/install-cargo-deny.sh
    - bash .gitlab/scripts/cargo-deny-check.sh

# Makes the release audit's "every committed lockfile is clean" claim
# reproducible in CI: the same pinned cargo-deny over every manifest root
# with a tracked Cargo.lock, not just the ic workspace (MR !1371 review A5).
satellite-advisory-sweep:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - job: cargo-metadata
      artifacts: false
  script:
    - bash .gitlab/scripts/install-cargo-deny.sh
    - bash .gitlab/scripts/install-cargo-audit.sh
    - bash .gitlab/scripts/check-satellite-advisories.sh

# cargo-deny filters crates that are pinned in Cargo.lock but never resolved
# into the built graph, so advisories against such pins stay invisible. This
# guard fails loudly if one of those pins ever starts compiling.
lockfile-only-advisory-guard:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - job: cargo-metadata
      artifacts: false
  script:
    - bash .gitlab/scripts/check-lockfile-only-advisories.sh

# The WI#331 mitigation keeps the libsql 0.6.0 legacy chain (rustls-webpki
# 0.102.8, h2 0.3.27) out of default-feature builds behind the opt-in
# libsql-remote-replica cargo feature. Every deny gate queries
# --workspace --all-features with ID-keyed ignores, so none of them can see
# this regression; this guard pins the default-feature production graph
# clean (MR !1513 review CZ-1).
default-graph-advisory-guard:
  extends:
    - .rust-job
    - .full-validation-context
  stage: security
  needs:
    - job: cargo-metadata
      artifacts: false
  script:
    - bash .gitlab/scripts/check-default-graph-advisories.sh

# WI#357 control 4: workers must never self-expose. Source/config/wrapper and
# bridge rules stay in the shell lane; WI#425 moves Dockerfile grammar to the
# required BuildKit-parser lane below.
worker-exposure-policy-guard:
  extends:
    - .shell-job
    - .full-validation-context
  stage: security
  needs: []
  script:
    - bash .gitlab/scripts/check-worker-exposure-policy.sh

worker-buildkit-parser-policy-guard:
  extends: .full-validation-context
  stage: security
  needs: []
  image:
    name: "docker.io/library/golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af"
  tags:
    - "$CI_LINT_RUNNER_TAG"
  variables:
    GOTOOLCHAIN: local
    GOFLAGS: -mod=readonly
    GOPROXY: https://proxy.golang.org
    GOSUMDB: sum.golang.org
  script:
    - cd .gitlab/go/dockerfile-parse
    - test -z "$(gofmt -l main.go main_test.go)"
    - go test ./...
    - go run . ../../../opencode2.4lunarwing/Dockerfile
    - go run . ../../../lunardepth4lunarwing/Dockerfile

secret-detection:
  extends: .gitleaks-job
  stage: security
  needs: []
  script:
    - bash .gitlab/scripts/scan-secrets.sh

# Exercise the real-scanner history harness before schedule/tag-only scans.
secret-history-regression:
  extends: .gitleaks-job
  stage: security
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - bash .gitlab/tests/test-secret-history.sh

# Owner: security maintainers. Historical triage: WI#575 / WI#590.
# Blocking full-history scan; only exact commit-bound fingerprints are ignored.
secret-history:
  extends: .gitleaks-job
  stage: security
  needs: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/tests/test-secret-history.sh
    - bash .gitlab/scripts/scan-secret-history.sh
