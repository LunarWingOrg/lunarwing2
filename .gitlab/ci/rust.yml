rust-check-default:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked

rust-check-postgres:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --no-default-features --features postgres

rust-check-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --no-default-features --features libsql

rust-check-all-features:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --all-features

# P0.4: compile every test target in the single-backend shapes. rust-check-*
# above only type-checks non-test code, so the 64 integration-test targets
# were never compiled in the postgres-only shape (and several were broken).
rust-check-tests-postgres:
  extends: .rust-job
  stage: test
  needs:
    - job: rust-check-postgres
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^aragents\/kimil00p\//'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features postgres

rust-check-tests-libsql:
  extends: .rust-job
  stage: test
  needs:
    - job: rust-check-libsql
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^aragents\/kimil00p\//'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features libsql

rust-msrv-check:
  extends:
    - .rust-msrv-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 60m
  script:
    - bash .gitlab/scripts/cargo-ci.sh check --locked
  after_script:
    - mv ic/rust-toolchain.toml.disabled ic/rust-toolchain.toml || true

# Owner: core maintainers. Block after one clean runner baseline proves zero warnings.
rust-clippy-all:
  extends:
    - .rust-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 60m
  script:
    - bash .gitlab/scripts/cargo-ci.sh clippy -j2 --locked --all --benches --tests --examples --all-features -- -D warnings

rust-test-lib:
  extends: .rust-job
  stage: test
  needs:
    - job: rust-check-default
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 60m
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --workspace --lib -- --test-threads=1

rust-test-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-libsql
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 60m
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    # libSQL's full test link approaches the 16 GB runner limit; serialize rustc and omit debug info.
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features libsql --no-fail-fast -- --test-threads=1

wasm-channel-test-artifacts:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 30m
  script:
    - rustup target add --toolchain 1.96.1 wasm32-wasip2
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path channels-src/xmpp/Cargo.toml
    - cp ic/channels-src/xmpp/target/wasm32-wasip2/release/xmpp_channel.wasm ic/channels-src/xmpp/xmpp.wasm
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path ../lunarwing_weechat_wss/weechat_relay/Cargo.toml
  artifacts:
    expire_in: 1 day
    paths:
      - ic/channels-src/xmpp/xmpp.wasm
      - lunarwing_weechat_wss/weechat_relay/target/wasm32-wasip2/release/weechat_relay_channel.wasm
