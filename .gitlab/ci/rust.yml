rust-check-default:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked

rust-check-postgres:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features postgres

rust-check-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features libsql

rust-check-all-features:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --all-features

wasm-channel-test-artifacts:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - rustup target add --toolchain 1.96.1 wasm32-wasip2
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path channels-src/xmpp/Cargo.toml
    - cp ic/channels-src/xmpp/target/wasm32-wasip2/release/xmpp_channel.wasm ic/channels-src/xmpp/xmpp.wasm
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path ../lunarwing_weechat_wss/weechat_relay/Cargo.toml
  artifacts:
    expire_in: 1 day
    paths:
      - ic/channels-src/xmpp/xmpp.wasm
      - lunarwing_weechat_wss/weechat_relay/target/wasm32-wasip2/release/weechat_relay_channel.wasm

# Owner: core maintainers. Block after MSRV (1.96.1) is confirmed green and the
# plan §15.5 reconciliation is closed. Removing this job reopens the
# Cargo.toml rust-version vs CI toolchain drift gap.
rust-msrv-check:
  extends:
    - .rust-msrv-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - bash .gitlab/scripts/cargo-ci.sh check --locked

# Owner: core maintainers. Block after one clean runner baseline proves zero warnings.
rust-clippy-all:
  extends:
    - .rust-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - bash .gitlab/scripts/cargo-ci.sh clippy -j2 --locked --all --benches --tests --examples --all-features -- -D warnings

rust-test-lib:
  extends: .rust-job
  stage: test
  needs:
    - job: rust-check-default
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 2h
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --workspace --lib -- --test-threads=1

rust-test-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-libsql
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 2h
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    # libSQL's full test link approaches the 16 GB runner limit; serialize rustc and omit debug info.
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features libsql --no-fail-fast -- --test-threads=1

rust-test-postgres-integration:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-postgres
      artifacts: false
  timeout: 2h
  services:
    - name: "docker.io/pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b"
      alias: postgres
  variables:
    POSTGRES_DB: lunarwing_test
    POSTGRES_USER: lunarwing
    POSTGRES_PASSWORD: lunarwing-ci-only
    DATABASE_URL: "postgres://lunarwing:lunarwing-ci-only@postgres:5432/lunarwing_test"
    DATABASE_SSLMODE: disable
    PGSSLMODE: disable
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features postgres,integration --test workspace_integration -- --test-threads=1
