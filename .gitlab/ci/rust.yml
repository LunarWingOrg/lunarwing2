rust-check-default:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j6 --locked

rust-check-postgres:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j6 --locked --no-default-features --features postgres

rust-check-libsql:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j6 --locked --no-default-features --features libsql

rust-check-all-features:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j6 --locked --all-features

# Owner: core maintainers. Block after one clean runner baseline proves zero warnings.
rust-clippy-all:
  extends:
    - .rust-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 60m
  script:
    - bash .gitlab/scripts/cargo-ci.sh clippy -j6 --locked --all --benches --tests --examples --all-features -- -D warnings

rust-test-lib:
  extends: .rust-job
  stage: test
  needs:
    - rust-check-default
  timeout: 60m
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j6 --locked --workspace --lib -- --test-threads=1

rust-test-libsql:
  extends: .rust-job
  stage: test
  needs:
    - rust-check-libsql
  timeout: 60m
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
  script:
    # libSQL's full test link exceeds the 16 GB runner limit with six concurrent rustc jobs.
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --no-default-features --features libsql --no-fail-fast -- --test-threads=1
