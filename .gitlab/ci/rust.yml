rust-check-default:
  extends: .rust-job
  stage: check
  # Runner eligibility and host-side concurrency limits enforce memory budgets.
  # Independent runners may compile concurrently, including across pipelines.
  needs:
    - cargo-metadata
  # The protected cache writer performs this same check on default-branch
  # pushes. Other contexts keep the pull-only validation job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: never
    - when: on_success
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked

rust-cache-refresh:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  cache:
    - key:
        prefix: "rust-1.96.1-dependencies"
        files:
          - ic/Cargo.lock
      paths:
        - .ci-cache/cargo/registry/index/
        - .ci-cache/cargo/registry/cache/
        - .ci-cache/cargo/git/db/
      policy: pull-push
    - key: "rust-1.96.1-sccache"
      paths:
        - .ci-cache/bin/
        - .ci-cache/sccache/
      policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked

rust-check-postgres:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features postgres

rust-check-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features libsql

rust-check-all-features:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --all-features

# Standalone (non-workspace) deliverables from .gitlab/deliverables.json:
# locked offline metadata verification per classified unit so a stale
# lockfile or classification fails before artifacts consume it. Parsing is
# Python-only (no jq), so the job runs on the standard Rust bootstrap.
standalone-deliverables:
  extends: .rust-job
  stage: check
  needs: []
  script:
    - python3 .gitlab/scripts/standalone-deliverables.py

wasm-channel-test-artifacts:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - rustup target add --toolchain 1.96.1 wasm32-wasip2
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path channels-src/xmpp/Cargo.toml
    - cp ic/channels-src/xmpp/target/wasm32-wasip2/release/xmpp_channel.wasm ic/channels-src/xmpp/xmpp.wasm
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path ../lunarwing_weechat_wss/weechat_relay/Cargo.toml
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path ../darkirc_channel_for_lunarwing/darkirc/Cargo.toml
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path tests/fixtures/test-echo-tool/Cargo.toml
  artifacts:
    expire_in: 1 day
    paths:
      - ic/channels-src/xmpp/xmpp.wasm
      - lunarwing_weechat_wss/weechat_relay/target/wasm32-wasip2/release/weechat_relay_channel.wasm
      - darkirc_channel_for_lunarwing/darkirc/target/wasm32-wasip2/release/darkirc_channel.wasm
      - ic/tests/fixtures/test-echo-tool/target/wasm32-wasip2/release/test_echo_tool.wasm

rust-test-wasm-channels:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs: []
  variables:
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/.ci-cache/wasm-channel-test-target"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --lib --manifest-path ../darkirc_channel_for_lunarwing/darkirc/Cargo.toml -- --test-threads=1
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --lib --manifest-path ../lunarwing_weechat_wss/weechat_relay/Cargo.toml -- --test-threads=1
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --lib --manifest-path channels-src/xmpp/Cargo.toml -- --test-threads=1
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --lib --manifest-path channels-src/multica/Cargo.toml -- --test-threads=1

# Owner: core maintainers. Block after MSRV (1.96.1) is confirmed green and the
# plan §15.5 reconciliation is closed. Removing this job reopens the
# Cargo.toml rust-version vs CI toolchain drift gap.
rust-msrv-check:
  extends:
    - .rust-msrv-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - bash .gitlab/scripts/cargo-ci.sh check --locked

# Owner: core maintainers. Blocking since 2026-09-11 (goals 2.1.1.0 item 23):
# all-features zero-warning Clippy is green on the default branch and locally.
rust-clippy-all:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - bash .gitlab/scripts/cargo-ci.sh clippy -j2 --locked --all --benches --tests --examples --all-features -- -D warnings

# WI#864: ic/bridges/xmpp-bridge and its contract crate
# (ic/openclaw-ports/xmpp/bridge) are excluded from the ic workspace, each
# with its own Cargo.lock, so no workspace job ever compiled, tested or linted
# them — a broken bridge change could merge with a green pipeline (WI#854's
# !2707 changed 335 lines of bridge Rust and its pipeline never built it).
# Both crates run here in their own invocations from ic/ so the vendored
# source replacement applies (ic/.cargo/config.toml), with --locked and
# clippy -D warnings. Pinned by validate_config.py
# (validate_xmpp_bridge_rust_lane). needs: [] keeps every earlier-stage
# artifact and dotenv variable out of the pinned script.
rust-xmpp-bridge:
  extends: .rust-job
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --manifest-path bridges/xmpp-bridge/Cargo.toml
    - bash .gitlab/scripts/cargo-ci.sh clippy -j2 --locked --manifest-path bridges/xmpp-bridge/Cargo.toml --all-targets -- -D warnings
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --manifest-path openclaw-ports/xmpp/bridge/Cargo.toml
    - bash .gitlab/scripts/cargo-ci.sh clippy -j2 --locked --manifest-path openclaw-ports/xmpp/bridge/Cargo.toml --all-targets -- -D warnings

rust-test-lib:
  extends: .rust-job
  stage: test
  needs:
    - job: rust-check-default
      artifacts: false
      optional: true
    - job: rust-cache-refresh
      artifacts: false
      optional: true
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 2h
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --workspace --lib -- --test-threads=1
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --manifest-path unix-socket-client/Cargo.toml -- --test-threads=1

rust-test-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-libsql
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 2h
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    # libSQL's full test link approaches the 16 GB runner limit; serialize rustc and omit debug info.
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features libsql --no-fail-fast -- --test-threads=1

rust-test-libsql-integration:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-libsql
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    # Separate from the regular libSQL suite to bound per-job disk and runtime.
    - >-
      bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features
      --features libsql,integration,html-to-markdown --no-fail-fast
      --test e2e_thread_scheduling
      --test engine_v2_eager_init
      --test engine_v2_interrupt_ingress
      --test engine_v2_channel_delivery
      --test engine_v2_irc_wasm
      --test engine_v2_wasm_tool
      --test engine_v2_mcp_compatibility
      --test engine_v2_skill_selection
      --test engine_v2_tool_info_missions
      --test engine_v2_tensorzero_streaming
      --test html_to_markdown
      -- --test-threads=1

rust-test-postgres-integration:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-postgres
      artifacts: false
  timeout: 2h
  services:
    - name: "docker.io/pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f"
      alias: postgres
  variables:
    POSTGRES_DB: lunarwing_test
    POSTGRES_USER: lunarwing
    POSTGRES_PASSWORD: lunarwing-ci-only
    DATABASE_URL: "postgres://lunarwing:lunarwing-ci-only@postgres:5432/lunarwing_test"
    DATABASE_SSLMODE: disable
    PGSSLMODE: disable
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    # WI#370: postgres_cron_retention pins the job_events FK semantics the
    # cron retention sweep depends on (the generic external_worker_integration
    # target is auto-discovered only by the libSQL lane).
    # WI#318: exercise the saved local-job estimate and its gateway projection.
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features postgres,integration --test workspace_integration --test postgres_settings_migrations --test postgres_cron_retention --test job_estimate_postgres -- --test-threads=1
