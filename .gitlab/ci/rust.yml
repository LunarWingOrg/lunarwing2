rust-check-default:
  extends: .rust-job
  stage: check
  # Runner eligibility and host-side concurrency limits enforce memory budgets.
  # Independent runners may compile concurrently, including across pipelines.
  needs:
    - cargo-metadata
  # The protected cache writer performs this same check on default-branch
  # pushes. Other contexts keep the pull-only validation job.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: never
    - when: on_success
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked

rust-cache-refresh:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  cache:
    - key:
        prefix: "rust-1.96.1-dependencies"
        files:
          - ic/Cargo.lock
      paths:
        - .ci-cache/cargo/registry/index/
        - .ci-cache/cargo/registry/cache/
        - .ci-cache/cargo/git/db/
      policy: pull-push
    - key: "rust-1.96.1-sccache"
      paths:
        - .ci-cache/bin/
        - .ci-cache/sccache/
      policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked

rust-check-postgres:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features postgres

rust-check-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --tests --no-default-features --features libsql

rust-check-all-features:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  script:
    - bash .gitlab/scripts/cargo-ci.sh check -j2 --locked --all-features

# Standalone (non-workspace) deliverables from .gitlab/deliverables.json:
# locked offline metadata verification per classified unit so a stale
# lockfile or classification fails before artifacts consume it. Parsing is
# Python-only (no jq), so the job runs on the standard Rust bootstrap.
standalone-deliverables:
  extends: .rust-job
  stage: check
  needs: []
  script:
    - python3 .gitlab/scripts/standalone-deliverables.py

wasm-channel-test-artifacts:
  extends: .rust-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - rustup target add --toolchain 1.96.1 wasm32-wasip2
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path channels-src/xmpp/Cargo.toml
    - cp ic/channels-src/xmpp/target/wasm32-wasip2/release/xmpp_channel.wasm ic/channels-src/xmpp/xmpp.wasm
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --locked --release --target wasm32-wasip2 --manifest-path ../lunarwing_weechat_wss/weechat_relay/Cargo.toml
  artifacts:
    expire_in: 1 day
    paths:
      - ic/channels-src/xmpp/xmpp.wasm
      - lunarwing_weechat_wss/weechat_relay/target/wasm32-wasip2/release/weechat_relay_channel.wasm

# Owner: core maintainers. Block after MSRV (1.96.1) is confirmed green and the
# plan §15.5 reconciliation is closed. Removing this job reopens the
# Cargo.toml rust-version vs CI toolchain drift gap.
rust-msrv-check:
  extends:
    - .rust-msrv-job
    - .observational-job
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - bash .gitlab/scripts/cargo-ci.sh check --locked

# Owner: core maintainers. Blocking since 2026-09-11 (goals 2.1.1.0 item 23):
# all-features zero-warning Clippy is green on the default branch and locally.
rust-clippy-all:
  extends:
    - .rust-job
    - .full-validation-context
  stage: check
  needs:
    - cargo-metadata
  timeout: 2h
  script:
    - bash .gitlab/scripts/cargo-ci.sh clippy -j2 --locked --all --benches --tests --examples --all-features -- -D warnings

rust-test-lib:
  extends: .rust-job
  stage: test
  needs:
    - job: rust-check-default
      artifacts: false
      optional: true
    - job: rust-cache-refresh
      artifacts: false
      optional: true
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 2h
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --workspace --lib -- --test-threads=1

rust-test-libsql:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-libsql
      artifacts: false
    - job: wasm-channel-test-artifacts
      artifacts: true
  timeout: 2h
  variables:
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    # libSQL's full test link approaches the 16 GB runner limit; serialize rustc and omit debug info.
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features libsql --no-fail-fast -- --test-threads=1

rust-test-postgres-integration:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  needs:
    - job: rust-check-postgres
      artifacts: false
  timeout: 2h
  services:
    - name: "docker.io/pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b"
      alias: postgres
  variables:
    POSTGRES_DB: lunarwing_test
    POSTGRES_USER: lunarwing
    POSTGRES_PASSWORD: lunarwing-ci-only
    DATABASE_URL: "postgres://lunarwing:lunarwing-ci-only@postgres:5432/lunarwing_test"
    DATABASE_SSLMODE: disable
    PGSSLMODE: disable
    LUNARWING_CLOUD_AUTH_URL: "http://127.0.0.1"
    LUNARWING_CLOUD_BASE_URL: "http://127.0.0.1"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    - bash .gitlab/scripts/cargo-ci.sh test -j1 --locked --no-default-features --features postgres,integration --test workspace_integration -- --test-threads=1
