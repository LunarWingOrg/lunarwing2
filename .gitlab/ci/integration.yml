python-unit:
  extends: .python-job
  stage: test
  needs:
    - python-syntax
  script:
    - python3 .gitlab/scripts/python_tests.py
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: junit-python.xml

shell-harnesses:
  extends: .python-job
  stage: test
  needs:
    - shell-syntax
  timeout: 2h
  script:
    - bash .gitlab/scripts/shell-harnesses-junit.sh
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: junit-shell.xml

cavepony-wasm:
  extends:
    - .rust-job
    - .full-validation-context
  stage: test
  # The wit_compat step compiles the lunarwing lib test binary (the same
  # giant-crates rustc as the check/test jobs), so this job shares the
  # project-wide compile resource group — without it an overlapping pipeline
  # can still OOM-kill rustc (MR !997 review P2).
  resource_group: rust-compile-16gb
  variables:
    CAVEPONY_EXPECTED_VERSION: "0.4.2"
    CAVEPONY_WASM_REQUIRED: "1"
  needs:
    - job: rust-check-default
      artifacts: false
      optional: true
    - job: rust-cache-refresh
      artifacts: false
      optional: true
  timeout: 2h
  script:
    - rustup target add --toolchain 1.96.1 wasm32-wasip2
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --release --target wasm32-wasip2 --manifest-path tools-src/cavepony/Cargo.toml
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --test wit_compat cavepony_component_actions_fit_ten_million_fuel -- --exact

# Architecture boundaries: blocking changed-line/hard-violation ratchet since
# 2026-09-11 (goals 2.1.1.0 item 23). The script exits non-zero only for NEW
# hard violations vs the pipeline base; the full-tree debt counts it prints
# above them remain informational warnings for gradual cleanup.
architecture-boundaries:
  extends:
    - .shell-job
    - .full-validation-context
  stage: test
  needs: []
  script:
    - bash ic/scripts/check-boundaries.sh

# Owner: operations maintainers. The repository warning baseline is zero, so
# shellcheck is a blocking validation gate on every pipeline. ShellCheck is
# pinned to 0.11.0 via a checksum-pinned download (MR !988) — the Debian
# bookworm apt package is 0.9.0, below the project floor.
shellcheck:
  extends: .shell-job
  stage: validate
  needs: []
  script:
    - bash .gitlab/scripts/install-shellcheck.sh
    - PATH="$CI_PROJECT_DIR/.ci-bin:$PATH" bash .gitlab/scripts/shellcheck.sh
