python-unit:
  extends: .python-job
  stage: test
  needs:
    - python-syntax
  script:
    - python3 .gitlab/scripts/python_tests.py

shell-harnesses:
  extends: .python-job
  stage: test
  needs:
    - shell-syntax
  timeout: 30m
  script:
    - bash .gitlab/scripts/shell-harnesses.sh

cavepony-wasm:
  extends: .rust-job
  stage: test
  needs:
    - rust-check-default
  timeout: 30m
  script:
    - rustup target add --toolchain 1.96.1 wasm32-wasip2
    - bash .gitlab/scripts/cargo-ci.sh build -j2 --release --target wasm32-wasip2 --manifest-path tools-src/cavepony/Cargo.toml
    - bash .gitlab/scripts/cargo-ci.sh test -j2 --locked --test wit_compat cavepony_component_actions_fit_ten_million_fuel -- --exact

# Owner: architecture maintainers. Block after current heuristic violations are fixed.
architecture-boundaries:
  extends:
    - .shell-job
    - .observational-job
  stage: observe
  needs: []
  script:
    - bash ic/scripts/check-boundaries.sh

# Owner: operations maintainers. Block after existing warning baseline reaches zero.
shellcheck:
  extends:
    - .shell-job
    - .observational-job
  stage: observe
  needs: []
  script:
    - bash .gitlab/scripts/shellcheck.sh
