default:
  interruptible: true
  timeout: 45m
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  CARGO_HOME: "$CI_PROJECT_DIR/.ci-cache/cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_TERM_COLOR: always
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.ci-cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: "1"
  CI_LINT_RUNNER_TAG: lint
  CI_RUST_RUNNER_TAG: rust-x86_64

.lint-job:
  image:
    name: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"
  tags:
    - "$CI_LINT_RUNNER_TAG"

.shell-job:
  extends: .lint-job
  before_script:
    - bash .gitlab/scripts/bootstrap-shell.sh

.python-job:
  extends: .lint-job
  before_script:
    - bash .gitlab/scripts/bootstrap-python.sh
  cache:
    key:
      prefix: "python-3.12"
      files:
        - .gitlab/requirements/python-tests.txt
    paths:
      - .ci-cache/pip/
    policy: pull-push

.rust-job:
  image:
    name: "docker.io/library/rust:1.92-bookworm@sha256:e90e846de4124376164ddfbaab4b0774c7bdeef5e738866295e5a90a34a307a2"
  tags:
    - "$CI_RUST_RUNNER_TAG"
  before_script:
    - bash .gitlab/scripts/bootstrap-rust.sh
  cache:
    key:
      prefix: "rust-1.92-dependencies"
      files:
        - ic/Cargo.lock
    paths:
      - .ci-cache/cargo/registry/index/
      - .ci-cache/cargo/registry/cache/
      - .ci-cache/cargo/git/db/
    policy: pull-push

.gitleaks-job:
  image:
    name: "docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"

.observational-job:
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
