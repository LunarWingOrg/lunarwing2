default:
  interruptible: true
  timeout: 45m
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  CARGO_HOME: "$CI_PROJECT_DIR/.ci-cache/cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  CARGO_TERM_COLOR: always
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.ci-cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: "1"
  CI_LINT_RUNNER_TAG: lint
  CI_RUST_RUNNER_TAG: rust-x86_64
  # Job base images, digest-pinned on Docker Hub. When Docker Hub's anonymous
  # pull rate limit (100 pulls/6h per egress IPv4) is exhausted, jobs die
  # before tests run with `toomanyrequests` on image pull — see the
  # "Docker Hub pull rate limits" section of .gitlab/README.md. To ride out
  # an exhausted quota without a repo change, mirror these images into the
  # project container registry (same digests; they are content-addressed) and
  # override any of these variables at project/group level.
  CI_LINT_IMAGE: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"
  CI_RUST_IMAGE: "docker.io/library/rust:1.96.1-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663"
  CI_GITLEAKS_IMAGE: "docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  # sccache: shared compile-artifact cache across the Rust jobs (installed by
  # bootstrap-sccache.sh; nothing required on the runner host). The 80G value
  # is only the eviction cap — actual usage tracks what the workspace needs.
  # Note: GitLab zips SCCACHE_DIR into the job cache, so real size matters.
  RUSTC_WRAPPER: "$CI_PROJECT_DIR/.ci-cache/bin/sccache"
  SCCACHE_DIR: "$CI_PROJECT_DIR/.ci-cache/sccache"
  SCCACHE_CACHE_SIZE: "80G"

.lint-job:
  image:
    name: "$CI_LINT_IMAGE"
  tags:
    - "$CI_LINT_RUNNER_TAG"

.shell-job:
  extends: .lint-job
  before_script:
    - bash .gitlab/scripts/bootstrap-shell.sh

.python-job:
  extends: .lint-job
  before_script:
    - bash .gitlab/scripts/bootstrap-python.sh
  cache:
    key:
      prefix: "python-3.12"
      files:
        - .gitlab/requirements/python-tests.txt
    paths:
      - .ci-cache/pip/
    policy: pull-push

.rust-job:
  image:
    name: "$CI_RUST_IMAGE"

  tags:
    - "$CI_RUST_RUNNER_TAG"
  before_script:
    - bash .gitlab/scripts/bootstrap-rust.sh
    - bash .gitlab/scripts/bootstrap-sccache.sh
  cache:
    # Downloaded crates: keyed on Cargo.lock (new deps re-fetch on change).
    - key:
        prefix: "rust-1.96.1-dependencies"
        files:
          - ic/Cargo.lock
      paths:
        - .ci-cache/cargo/registry/index/
        - .ci-cache/cargo/registry/cache/
        - .ci-cache/cargo/git/db/
      policy: pull-push
    # sccache + its binary: static key — one self-overwriting archive, so
    # lockfile changes neither reset the artifact cache nor pile up stale
    # zips on the runner host. 80G live cap enforced by sccache itself.
    - key: "rust-1.96.1-sccache"
      paths:
        - .ci-cache/bin/
        - .ci-cache/sccache/
      policy: pull-push

# MSRV check uses a separate cache namespace so future primary-toolchain bumps
# do not contaminate artifacts built with the declared minimum toolchain.
# rust-toolchain.toml is moved aside so rustup selects the image rustc.
.rust-msrv-job:
  image:
    name: "$CI_RUST_IMAGE"
  tags:
    - "$CI_RUST_RUNNER_TAG"
  before_script:
    - bash .gitlab/scripts/bootstrap-msrv.sh
    - bash .gitlab/scripts/bootstrap-sccache.sh
    - mv ic/rust-toolchain.toml ic/rust-toolchain.toml.disabled
  cache:
    - key:
        prefix: "rust-1.96.1-msrv"
        files:
          - ic/Cargo.lock
      paths:
        - .ci-cache/cargo/registry/index/
        - .ci-cache/cargo/registry/cache/
        - .ci-cache/cargo/git/db/
      policy: pull-push
    - key: "rust-1.96.1-msrv-sccache"
      paths:
        - .ci-cache/bin/
        - .ci-cache/sccache/
      policy: pull-push

.gitleaks-job:
  image:
    name: "$CI_GITLEAKS_IMAGE"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"

.observational-job:
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - when: never
