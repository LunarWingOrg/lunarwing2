default:
  interruptible: true
  timeout: 45m
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none
  CARGO_HOME: "$CI_PROJECT_DIR/.ci-cache/cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  CARGO_TERM_COLOR: always
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.ci-cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: "1"
  CI_LINT_RUNNER_TAG: lint
  CI_RUST_RUNNER_TAG: rust-x86_64
  # Job base images, digest-pinned on Docker Hub. When Docker Hub's anonymous
  # pull rate limit (100 pulls/6h per egress IPv4) is exhausted, jobs die
  # before tests run with `toomanyrequests` on image pull — see the
  # "Docker Hub pull rate limits" section of .gitlab/README.md. To ride out
  # an exhausted quota without a repo change, mirror these images into the
  # project container registry (same digests; they are content-addressed) and
  # override any of these variables at project/group level.
  CI_LINT_IMAGE: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"
  CI_RUST_IMAGE: "docker.io/library/rust:1.96.1-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663"
  CI_GITLEAKS_IMAGE: "docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  # sccache: shared compile-artifact cache across the Rust jobs (installed by
  # bootstrap-sccache.sh; nothing required on the runner host).
  # P0.5 disk contract: the Rust runner documents a 40 GiB disk budget (see
  # .gitlab/README.md "GitLab setup runbook"). After checkout (~1.5 GiB),
  # target/ during test builds, and the cargo registry cache, ~20 GiB of warm
  # space remains; this cap must stay below 40% of it. 10 GiB is the eviction
  # cap, not live usage — sccache evicts LRU entries at the cap. Note: GitLab
  # zips SCCACHE_DIR into the job cache, so real size matters.
  RUSTC_WRAPPER: "$CI_PROJECT_DIR/.ci-cache/bin/sccache"
  SCCACHE_DIR: "$CI_PROJECT_DIR/.ci-cache/sccache"
  SCCACHE_CACHE_SIZE: "10G"

.lint-job:
  image:
    name: "$CI_LINT_IMAGE"
  tags:
    - "$CI_LINT_RUNNER_TAG"

.shell-job:
  extends: .lint-job
  before_script:
    - bash .gitlab/scripts/bootstrap-shell.sh

.python-job:
  extends: .lint-job
  before_script:
    - bash .gitlab/scripts/bootstrap-python.sh
  cache:
    key:
      prefix: "python-3.12"
      files:
        - .gitlab/requirements/python-tests.txt
    paths:
      - .ci-cache/pip/
    policy: pull-push

.rust-job:
  image:
    name: "$CI_RUST_IMAGE"

  tags:
    - "$CI_RUST_RUNNER_TAG"
  before_script:
    - bash .gitlab/scripts/bootstrap-rust.sh
    - bash .gitlab/scripts/bootstrap-sccache.sh
    # P0.5 telemetry: baseline disk state before the build starts.
    - df -h "$CI_PROJECT_DIR" || true
  after_script:
    # P0.5 telemetry: disk high-water + sccache effectiveness per job. These
    # logs feed runner health review; telemetry must never mask test results.
    - df -h "$CI_PROJECT_DIR" || true
    - du -sh "$CI_PROJECT_DIR/ic/target" 2>/dev/null || true
    - "$CI_PROJECT_DIR/.ci-cache/bin/sccache" --show-stats || true
  cache:
    # Downloaded crates: keyed on Cargo.lock (new deps re-fetch on change).
    - key:
        prefix: "rust-1.96.1-dependencies"
        files:
          - ic/Cargo.lock
      paths:
        - .ci-cache/cargo/registry/index/
        - .ci-cache/cargo/registry/cache/
        - .ci-cache/cargo/git/db/
      policy: pull-push
    # sccache + its binary: static key — one self-overwriting archive, so
    # lockfile changes neither reset the artifact cache nor pile up stale
    # zips on the runner host. 10G live cap enforced by sccache itself (P0.5).
    - key: "rust-1.96.1-sccache"
      paths:
        - .ci-cache/bin/
        - .ci-cache/sccache/
      policy: pull-push

# MSRV check uses a separate cache namespace so future primary-toolchain bumps
# do not contaminate artifacts built with the declared minimum toolchain.
# rust-toolchain.toml is moved aside so rustup selects the image rustc.
.rust-msrv-job:
  image:
    name: "$CI_RUST_IMAGE"
  tags:
    - "$CI_RUST_RUNNER_TAG"
  before_script:
    - bash .gitlab/scripts/bootstrap-msrv.sh
    - bash .gitlab/scripts/bootstrap-sccache.sh
    - mv ic/rust-toolchain.toml ic/rust-toolchain.toml.disabled
    - df -h "$CI_PROJECT_DIR" || true
  after_script:
    - df -h "$CI_PROJECT_DIR" || true
    - du -sh "$CI_PROJECT_DIR/ic/target" 2>/dev/null || true
    - "$CI_PROJECT_DIR/.ci-cache/bin/sccache" --show-stats || true
  cache:
    - key:
        prefix: "rust-1.96.1-msrv"
        files:
          - ic/Cargo.lock
      paths:
        - .ci-cache/cargo/registry/index/
        - .ci-cache/cargo/registry/cache/
        - .ci-cache/cargo/git/db/
      policy: pull-push
    - key: "rust-1.96.1-msrv-sccache"
      paths:
        - .ci-cache/bin/
        - .ci-cache/sccache/
      policy: pull-push

.gitleaks-job:
  image:
    name: "$CI_GITLEAKS_IMAGE"
    entrypoint: [""]
  tags:
    - "$CI_LINT_RUNNER_TAG"

# One reusable "full validation context" predicate (P0.3): every heavy gate —
# single-backend checks, full test suites, cargo-deny, WASM, future package
# prerequisites — must run in exactly the contexts where a release can depend
# on them. Previously these jobs only matched the default branch, MRs into it,
# and aragents/kimil00p/*, so a protected release tag pipeline skipped the
# entire quality matrix. The tag condition pins the version policy's own
# release/RC pattern so arbitrary tags still get the slim MR-tier pipeline.
.full-validation-context:
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: "$CI_COMMIT_BRANCH =~ /^aragents\/kimil00p\//"
    - if: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\.\d+(-rc[1-9]\d*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

.observational-job:
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_BRANCH =~ /^aragents\/kimil00p\//'
    - when: never
