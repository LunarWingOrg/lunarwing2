# Kimi Code CLI default configuration (baked into the worker image).
# Overridden per-tenant by KIMI_MODEL / KIMI_BASE_URL env vars in entrypoint.sh.
#
# The default provider is the LunarWing TensorZero gateway (OpenAI-compatible
# endpoint), the same function the OpenCode worker uses. It is reached over the
# NetBird overlay (cotterhomelab3.netbird.selfhosted) instead of the LAN static
# IP (192.168.1.157). The managed Kimi Code service (api.kimi.com) is no longer
# the default: since kimi-code 0.37.2, worker prompts against it fail.

default_model = "tensorzero/FrontierCODE"
# Headless worker lane: "auto" auto-approves everything, including commands the
# static analyzer cannot classify. "yolo" is stricter upstream (0.40.0+ holds
# dangerous-class commands), which a headless -p run can never answer — the task
# would stall to its full timeout (WI#195 finding 1).
default_permission_mode = "auto"
telemetry = false

[permission]
# The worker is a headless batch executor (kimi -p --output-format stream-json)
# with no TTY to answer an approval prompt. upstream 0.40.0 added a dangerous
# -command guard that asks in ALL permission modes; every prompt is an
# unanswered stall until the task timeout, so the guard must be off here.
dangerous_command_guard = false

[providers.tensorzero]
type = "openai"
base_url = "http://100.88.232.146:3000/openai/v1"
# Non-secret placeholder: the gateway on the private overlay accepts any bearer,
# and kimi-code refuses to run with an empty api_key. entrypoint.sh overwrites
# this with KIMI_API_KEY / TENSORZERO_API_KEY when either is provisioned.
api_key = "tensorzero"

[models."tensorzero/FrontierCODE"]
provider = "tensorzero"
model = "tensorzero::function_name::FrontierCODE"
max_context_size = 859000
capabilities = ["tool_use"]

[thinking]
enabled = true
effort = "high"
keep = "all"

[loop_control]
max_attempts_per_step = 10
reserved_context_size = 50000

[background]
max_running_tasks = 4
keep_alive_on_exit = false
