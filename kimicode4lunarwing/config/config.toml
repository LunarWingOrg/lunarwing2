# Kimi Code CLI default configuration (baked into the worker image).
# Overridden per-tenant by KIMI_MODEL / KIMI_BASE_URL env vars in entrypoint.sh.

default_model = "managed:kimi-code/kimi-for-coding"
default_permission_mode = "yolo"
telemetry = false

[providers."managed:kimi-code"]
type = "kimi"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""

[models."managed:kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = ["thinking", "always_thinking", "image_in", "video_in", "tool_use"]

[thinking]
enabled = true
effort = "high"
keep = "all"

[loop_control]
max_retries_per_step = 10
reserved_context_size = 50000

[background]
max_running_tasks = 4
keep_alive_on_exit = false
