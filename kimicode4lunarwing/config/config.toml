# Kimi Code CLI default configuration (baked into the worker image).
# Overridden per-tenant by KIMI_MODEL / KIMI_BASE_URL env vars in entrypoint.sh.
#
# The default provider is the LunarWing TensorMoon gateway (OpenAI-compatible
# endpoint). It is reached over the NetBird overlay at
# cotterhomelab3.netbird.selfhosted. The managed Kimi Code
# service (api.kimi.com) is no longer the default: since kimi-code 0.37.2,
# worker prompts against it fail.

default_model = "tensormoon/FrontierCODEK"
# Print mode (kimi -p) forces the auto permission policy regardless of this
# value; it stays "auto" so an interactive TUI fallback never stalls on an
# approval prompt (WI#195). Dangerous-command enforcement lives in the
# PreToolUse hook below (WI#206): live-verified against 2.0.2; the 2.1.1
# contract gate runs during the worker image build. In the verified behavior,
# the upstream dangerous_command_guard is skipped entirely in auto mode, so
# the hook — which fires before permission checks in every mode — is the
# fail-closed mechanism for the headless lane.
default_permission_mode = "auto"
telemetry = false

[permission]
# Kept at the upstream default (true). It is inert under -p/auto today, but
# leaving it explicitly on means a future upstream change that starts
# honoring the guard in auto mode fails CLOSED, not open. Never set this to
# false: KIMI_CODE_DANGEROUS_COMMAND_GUARD is scrubbed per task (WI#206).
dangerous_command_guard = true

# Fail-closed headless policy (WI#206): every Bash tool call passes through
# the baked guard before permission checks. Exit code 2 blocks the call and
# the reason is returned to the model as the tool error — a bounded, explicit
# denial instead of either auto-execution or an unanswered approval stall.
[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "node /app/hooks/headless_command_guard.mjs"
timeout = 10

[providers.tensormoon]
type = "openai"
base_url = "http://cotterhomelab3.netbird.selfhosted:3000/openai/v1"
# Non-secret placeholder: the gateway on the private overlay accepts any bearer,
# and kimi-code refuses to run with an empty api_key. entrypoint.sh overwrites
# this with KIMI_API_KEY / TENSORMOON_API_KEY when either is provisioned.
api_key = "tensormoon"

[models."tensormoon/FrontierCODEK"]
provider = "tensormoon"
model = "tensormoon::function_name::FrontierCODEK"
max_context_size = 859000
capabilities = ["tool_use"]

[thinking]
enabled = true
effort = "high"
keep = "all"

[loop_control]
max_attempts_per_step = 10
reserved_context_size = 50000

[background]
max_running_tasks = 4
keep_alive_on_exit = false
