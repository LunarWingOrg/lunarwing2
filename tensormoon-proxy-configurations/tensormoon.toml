# TensorMoon Gateway Configuration
# (formerly tensorzero.toml; same schema — TensorMoon is the fork of TensorZero 2026.6.0)
# Last updated Sep 15 2026 19:49
# Latest Change: switched FrontierDEEP entrypoint to ds_v41_flash_nanogpt_tee (TEE/deepseek-v4.1-flash via nanogpt)
# Prior Change: rebuilt FrontierCODEBlind fallbacks (kimi_k3_tee_chutes, qwen38_max_nanogpt)
# Earlier Change: added new FrontierDEEP function
# Special thanks to Sweetiebot, Volta, and Baud

[gateway]
bind_address = "0.0.0.0:3000"
global_outbound_http_timeout_ms = 2000000
# Explicitly enable asynchronous observability writes (default since TensorZero 2026.4.1; TensorMoon inherits it).
observability.async_writes = true

[object_storage]
# No persistent storage needed; required to be explicit before accepting image/file inputs.
type = "disabled"

[models.glm52_tee_chutes]
routing = ["chutes"]
[models.glm52_tee_chutes.timeouts.streaming]
ttft_ms = 90000
total_ms = 1800000
[models.glm52_tee_chutes.timeouts.non_streaming]
total_ms = 1800000
[models.glm52_tee_chutes.providers.chutes]
api_base = "https://llm.chutes.ai/v1/"
api_key_location = "env::CHUTES_AI_API_KEY"
model_name = "zai-org/GLM-5.2-TEE"
type = "openai"

[models.glm52_coding_zai]
routing = ["zai_coding"]
[models.glm52_coding_zai.timeouts.streaming]
ttft_ms = 199000
total_ms = 1800000
[models.glm52_coding_zai.timeouts.non_streaming]
total_ms = 1800000
[models.glm52_coding_zai.providers.zai_coding]
api_base = "https://api.z.ai/api/coding/paas/v4/"
api_key_location = "env::GLM_CODING_API_KEY"
model_name = "glm-5.2"
