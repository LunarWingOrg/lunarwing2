services:
  lunarvoice:
    build: .
    image: lunarwing/voice-service:latest
    container_name: lunarwing-voice-sidecar
    env_file: .env
    environment:
      VOICE_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    security_opt:
      - no-new-privileges:true
    volumes:
      - voice_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  voice_models:
