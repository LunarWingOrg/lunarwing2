[package]
name = "lunarwing-voice-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["onnx"]
onnx = ["dep:sherpa-rs"]

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
dashmap = "6"
governor = "0.8"
hound = "3.5"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "tts"], optional = true }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
