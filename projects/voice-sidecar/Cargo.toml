[package]
name = "lunarwing-voice-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["onnx"]
onnx = ["dep:sherpa-rs"]

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
dashmap = "6"
governor = "0.8"
hound = "3.5"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Git pin (2026-09-13, 857bedd3): crates.io 0.6.8 bundles a sherpa-onnx runtime
# that rejects NeMo-2.x Parakeet exports ("'vocab_size' does not exist in the
# metadata" at transducer decoder init). Master vendors sherpa-onnx v1.12.15,
# which supports parakeet-tdt-0.6b/0.6b-v2. API surface for our four call sites
# (whisper/transducer/tts/silero_vad) is unchanged.
sherpa-rs = { git = "https://github.com/thewh1teagle/sherpa-rs", rev = "857bedd35ec5215c65b4911fdadca31f403b6f6b", default-features = false, features = ["download-binaries", "tts"], optional = true }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
