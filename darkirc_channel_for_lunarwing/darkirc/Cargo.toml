[package]
name = "darkirc-channel"
version = "2.0.1"
edition = "2021"
description = "DarkIRC WASM channel for LunarWing"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Must match LunarWing's weechat channel (channels-src/weechat/Cargo.toml)
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
