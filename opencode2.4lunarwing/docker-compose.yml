x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      WITH_TOOLCHAINS: ${WITH_TOOLCHAINS:-false}
  image: lunarwing-worker-opencode2:latest
  working_dir: /workspace
  group_add:
    - "${HOST_GID:-1000}"
  volumes:
    - ${OPENCODE_CONFIG_FILE:-./config/opencode.json}:/app/config/opencode.json:ro,z
    - opencode2-data:/home/opencode2/.local/share/opencode:z
    - opencode2-config-home:/home/opencode2/.config/opencode2:z
    - ./workspace:/workspace:z
    - ./logs:/var/log/lunarwing:z
    - ./results:/app/results:z
    - ${SSH_DIR:-./.ssh-placeholder}:/home/opencode2/.host-ssh:ro
    - ${GITCONFIG_FILE:-./.gitconfig-placeholder}:/home/opencode2/.host-gitconfig:ro
  env_file:
    - path: ${EXTRA_ENV_FILE:-.env.secrets}
      required: false
  environment: &worker-env
    TENSORMOON_API_KEY: ${TENSORMOON_API_KEY:-dummy}
    TENSORZERO_API_KEY: ${TENSORZERO_API_KEY:-dummy} # pre-fork name, kept one release
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
    OPENCODE_PROVIDER_MAX_RETRIES: ${OPENCODE_PROVIDER_MAX_RETRIES:-2}
    OPENCODE_PROVIDER_RETRY_DELAY_MS: ${OPENCODE_PROVIDER_RETRY_DELAY_MS:-5000}
    OPENCODE_PROGRESS_HEARTBEAT_MS: ${OPENCODE_PROGRESS_HEARTBEAT_MS:-60000}
    OPENCODE_SESSION_ABORT_TIMEOUT_MS: ${OPENCODE_SESSION_ABORT_TIMEOUT_MS:-5000}
    AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-}
    LUNARWING_WORKER_ID: ${LUNARWING_WORKER_ID:-worker-opencode2-01}
    WORKSPACE_ROOT: /workspace
    OPENCODE_BIN: ${OPENCODE_BIN:-/usr/local/bin/opencode}
    FILE_UMASK: ${FILE_UMASK:-0002}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GH_TOKEN: ${GH_TOKEN:-}
    GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
    GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
    GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
    GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}
    PASEO_URL: ${PASEO_URL:-}
    PASEO_TOKEN: ${PASEO_TOKEN:-}

services:
  lunarwing-worker:
    <<: *worker-base
    command: ["--mode", "websocket"]
    environment:
      <<: *worker-env
      OPENCODE_MODE: websocket
      WS_ROLE: server
      HEALTH_PORT: ${HEALTH_PORT:-8443}
      OPENCODE_SERVE_PORT: ${OPENCODE_SERVE_PORT:-4096}
      OPENCODE_SERVE_HOST: ${OPENCODE_SERVE_HOST:-127.0.0.1}
      WS_BIND_HOST: ${WS_BIND_HOST:-0.0.0.0}
      WS_PORT: ${WS_PORT:-9090}
      WS_PATH: ${WS_PATH:-/ws/agent}
    ports:
      # Loopback only — the bridge accepts tasks over WS and AGENT_AUTH_TOKEN
      # defaults to empty, so publishing on all interfaces would let anyone on
      # the LAN drive an auto-approving agent.
      - "127.0.0.1:${HEALTH_PORT:-8443}:${HEALTH_PORT:-8443}"
      - "127.0.0.1:${WS_PORT:-9090}:${WS_PORT:-9090}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${HEALTH_PORT:-8443}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  agent-smoke:
    <<: *worker-base
    profiles: ["smoke"]
    depends_on:
      lunarwing-worker:
        condition: service_healthy
    entrypoint: ["bun", "run", "/app/scripts/smoke_test.ts"]
    command: []
    environment:
      <<: *worker-env
      SMOKE_WS_HOST: lunarwing-worker
      SMOKE_WS_PORT: ${WS_PORT:-9090}
      SMOKE_HEALTH_PORT: ${HEALTH_PORT:-8443}
    restart: "no"

  opencode2-cli:
    <<: *worker-base
    profiles: ["cli"]
    command: ["--mode", "cli", "--", "${TASK_PROMPT:-Write a hello world Python script}"]
    environment:
      <<: *worker-env
      OPENCODE_MODE: cli
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  opencode2-data:
  opencode2-config-home:
