<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wings raised -->
  <polygon points="28,38 8,20 4,28 12,36 18,34 24,40 28,42"
           fill="#0D47A1" stroke="url(#wingGrad)" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="72,38 92,20 96,28 88,36 82,34 76,40 72,42"
           fill="#0D47A1" stroke="url(#wingGrad)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Ears -->
  <polygon points="34,32 38,16 44,30" fill="#0D47A1"/>
  <polygon points="56,30 62,16 66,32" fill="#0D47A1"/>
  <polygon points="36,30 39,20 42,28" fill="#1565C0"/>
  <polygon points="58,28 61,20 64,30" fill="#1565C0"/>

  <!-- Body -->
  <ellipse cx="50" cy="52" rx="22" ry="24" fill="#0D47A1"/>

  <!-- Eyebrows (angled inward/down) -->
  <polygon points="36,40 48,45 47,47 37,42" fill="#4FC3F7"/>
  <polygon points="64,40 52,45 53,47 63,42" fill="#4FC3F7"/>

  <!-- Red glowing eyes -->
  <circle cx="42" cy="51" r="5" fill="#E64C4C" filter="url(#glow)"/>
  <circle cx="58" cy="51" r="5" fill="#E64C4C" filter="url(#glow)"/>
  <circle cx="42" cy="51" r="2" fill="#0D47A1"/>
  <circle cx="58" cy="51" r="2" fill="#0D47A1"/>

  <!-- Bared fangs (white triangles) -->
  <polygon points="44,60 46,60 45,66" fill="#FFFFFF"/>
  <polygon points="54,60 56,60 55,66" fill="#FFFFFF"/>

  <!-- Angry mouth line -->
  <path d="M42,59 Q50,62 58,59" fill="none" stroke="#B3E5FC" stroke-width="2" stroke-linecap="round"/>
</svg>
